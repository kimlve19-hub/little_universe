<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#040510">
<title>Little Universe | V3</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #040510;
  color: white;
  transition: background 0.8s, color 0.8s;
}

#universe {
  position: fixed;
  inset: 0;
}

canvas {
  display: block;
  touch-action: none;
}

.header {
  position: fixed;
  top: 38px;
  width: 100%;
  text-align: center;
  z-index: 5;
  pointer-events: none;
}

.header h1 {
  font-size: 23px;
  font-weight: 300;
  letter-spacing: 6px;
}

.header p {
  margin-top: 12px;
  font-size: 10px;
  letter-spacing: 4px;
  color: #aaa9df;
  transition: color 0.8s;
}

.theme-toggle {
  position: fixed;
  top: 22px;
  right: 20px;
  z-index: 10;
  width: 43px;
  height: 43px;
  border: 1px solid rgba(180,170,255,0.4);
  border-radius: 50%;
  background: rgba(60,50,110,0.35);
  color: white;
  font-size: 19px;
  cursor: pointer;
  backdrop-filter: blur(12px);
  transition: 0.4s;
}

.theme-toggle:active {
  transform: scale(0.88);
}

.footer {
  position: fixed;
  bottom: 35px;
  width: 100%;
  text-align: center;
  z-index: 5;
  pointer-events: none;
}

.footer p {
  font-size: 10px;
  letter-spacing: 3px;
  color: #aaa9d9;
  transition: color 0.8s;
}

#status {
  margin-top: 10px;
  font-size: 9px;
  color: #7778b8;
}

body.light {
  background: #eaf0ff;
  color: #41416e;
}

body.light .header p {
  color: #7274a9;
}

body.light .footer p {
  color: #7476a4;
}

body.light #status {
  color: #8586b9;
}

body.light .theme-toggle {
  background: rgba(255,255,255,0.75);
  color: #5c579b;
  border-color: rgba(130,120,190,0.4);
  box-shadow: 0 4px 20px rgba(100,100,180,0.15);
}

@media (max-width: 480px) {
  .header {
    top: 75px;
  }

  .header h1 {
    font-size: 19px;
  }

  .theme-toggle {
    top: 18px;
    right: 18px;
  }
}
</style>
</head>

<body>

<div id="universe"></div>

<button class="theme-toggle" id="themeToggle"
aria-label="Switch theme">☀️</button>

<div class="header">
  <h1>LITTLE UNIVERSE</h1>
  <p>BEYOND THE ORDINARY</p>
</div>

<div class="footer">
  <p>TOUCH & DRAG TO EXPLORE</p>
  <div id="status">BUILDING YOUR UNIVERSE...</div>
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const container = document.querySelector("#universe");
const status = document.querySelector("#status");
const toggle = document.querySelector("#themeToggle");

try {

// SCENE

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  50, innerWidth / innerHeight, 0.1, 100
);

camera.position.z = 7.5;

// RENDERER

const renderer = new THREE.WebGLRenderer({
  antialias: false,
  alpha: false
});

renderer.setPixelRatio(
  Math.min(devicePixelRatio, 1.25)
);

renderer.setSize(innerWidth, innerHeight);

container.appendChild(renderer.domElement);

// BACKGROUND

scene.background = new THREE.Color(0x040510);

// UNIVERSE

const universe = new THREE.Group();
scene.add(universe);

// PLANET TEXTURE

const canvas = document.createElement("canvas");

canvas.width = 512;
canvas.height = 256;

const ctx = canvas.getContext("2d");

const gradient = ctx.createLinearGradient(
  0, 0, 512, 256
);

gradient.addColorStop(0, "#101d50");
gradient.addColorStop(0.4, "#51409b");
gradient.addColorStop(0.7, "#193f78");
gradient.addColorStop(1, "#11132e");

ctx.fillStyle = gradient;
ctx.fillRect(0, 0, 512, 256);

for (let i = 0; i < 24; i++) {

  const x = Math.random() * 512;
  const y = Math.random() * 256;
  const size = 12 + Math.random() * 35;

  ctx.beginPath();
  ctx.moveTo(x, y);

  ctx.bezierCurveTo(
    x + size, y - size,
    x + size * 1.8, y + size,
    x + size * 0.8, y + size * 1.5
  );

  ctx.bezierCurveTo(
    x - size * 0.5, y + size * 1.8,
    x - size, y + size * 0.5,
    x, y
  );

  ctx.fillStyle =
    i % 2 === 0 ? "#8274c9" : "#326a9d";

  ctx.globalAlpha = 0.65;
  ctx.fill();
}

ctx.globalAlpha = 1;

for (let i = 0; i < 30; i++) {

  ctx.beginPath();

  const y = Math.random() * 256;

  ctx.moveTo(0, y);

  ctx.bezierCurveTo(
    140, y - 12,
    320, y + 15,
    512, y - 5
  );

  ctx.strokeStyle = "#a9b7ff";
  ctx.globalAlpha = 0.12;
  ctx.lineWidth = 2;
  ctx.stroke();
}

ctx.globalAlpha = 1;

const texture = new THREE.CanvasTexture(canvas);

texture.colorSpace = THREE.SRGBColorSpace;

// PLANET

const planet = new THREE.Mesh(
  new THREE.SphereGeometry(1.45, 64, 48),

  new THREE.MeshStandardMaterial({
    map: texture,
    roughness: 0.85,
    metalness: 0.12
  })
);

universe.add(planet);

// ATMOSPHERE

const atmosphere = new THREE.Mesh(
  new THREE.SphereGeometry(1.58, 48, 48),

  new THREE.MeshBasicMaterial({
    color: 0x8176ff,
    transparent: true,
    opacity: 0.14,
    side: THREE.BackSide,
    blending: THREE.AdditiveBlending
  })
);

universe.add(atmosphere);

// LIGHTS

const ambient = new THREE.AmbientLight(
  0x7777bb, 1.4
);

scene.add(ambient);

const violetLight = new THREE.PointLight(
  0xa58aff, 90, 30
);

violetLight.position.set(-4, 3, 5);
scene.add(violetLight);

const blueLight = new THREE.PointLight(
  0x368bff, 70, 25
);

blueLight.position.set(4, -3, -3);
scene.add(blueLight);

// ORBIT RINGS

const ringGroup = new THREE.Group();

universe.add(ringGroup);

ringGroup.rotation.x = 1.05;
ringGroup.rotation.y = 0.2;

const ringOne = new THREE.Mesh(
  new THREE.TorusGeometry(2.05, 0.014, 6, 160),

  new THREE.MeshBasicMaterial({
    color: 0x8c8bff,
    transparent: true,
    opacity: 0.85
  })
);

ringGroup.add(ringOne);

const ringTwo = new THREE.Mesh(
  new THREE.TorusGeometry(2.3, 0.007, 6, 160),

  new THREE.MeshBasicMaterial({
    color: 0x42caff,
    transparent: true,
    opacity: 0.55
  })
);

ringGroup.add(ringTwo);

// PARTICLES

const particleGroup = new THREE.Group();

universe.add(particleGroup);

for (let i = 0; i < 3; i++) {

  const particle = new THREE.Mesh(
    new THREE.SphereGeometry(0.045, 10, 10),

    new THREE.MeshBasicMaterial({
      color: i === 1 ? 0x65caff : 0xc6aaff
    })
  );

  particleGroup.add(particle);

  particle.userData.angle = i * Math.PI * 2 / 3;
}

// STARS

const starPositions = [];

for (let i = 0; i < 550; i++) {

  starPositions.push(
    (Math.random() - 0.5) * 50,
    (Math.random() - 0.5) * 50,
    (Math.random() - 0.5) * 40
  );

}

const starGeometry = new THREE.BufferGeometry();

starGeometry.setAttribute(
  "position",
  new THREE.Float32BufferAttribute(starPositions, 3)
);

const starMaterial = new THREE.PointsMaterial({
  color: 0xc7caff,
  size: 0.035,
  transparent: true,
  opacity: 0.8
});

const stars = new THREE.Points(
  starGeometry, starMaterial
);

scene.add(stars);

// THEME SYSTEM

let isLight = false;

const darkSettings = {
  background: 0x040510,
  ambient: 1.4,
  violet: 90,
  blue: 70,
  atmosphere: 0.14,
  ringOne: 0x8c8bff,
  ringTwo: 0x42caff,
  star: 0xc7caff,
  starOpacity: 0.8
};

const lightSettings = {
  background: 0xeaf0ff,
  ambient: 2.0,
  violet: 55,
  blue: 45,
  atmosphere: 0.32,
  ringOne: 0x7774ca,
  ringTwo: 0x43a9d9,
  star: 0x7378ae,
  starOpacity: 0.48
};

function applyTheme(light) {

  const settings = light
    ? lightSettings
    : darkSettings;

  scene.background.setHex(settings.background);

  ambient.intensity = settings.ambient;

  violetLight.intensity = settings.violet;
  blueLight.intensity = settings.blue;

  atmosphere.material.opacity = settings.atmosphere;

  ringOne.material.color.setHex(settings.ringOne);
  ringTwo.material.color.setHex(settings.ringTwo);

  starMaterial.color.setHex(settings.star);
  starMaterial.opacity = settings.starOpacity;

  document.body.classList.toggle("light", light);

  toggle.textContent = light ? "🌙" : "☀️";

  toggle.setAttribute(
    "aria-label",
    light ? "Switch to dark mode" : "Switch to light mode"
  );

  try {
    localStorage.setItem(
      "little-universe-theme",
      light ? "light" : "dark"
    );
  } catch (e) {}

}

let savedTheme = "dark";

try {
  savedTheme =
    localStorage.getItem("little-universe-theme") || "dark";
} catch (e) {}

isLight = savedTheme === "light";

applyTheme(isLight);

toggle.addEventListener("click", () => {

  isLight = !isLight;

  applyTheme(isLight);

});

// DRAG

let dragging = false;
let previousX = 0;
let previousY = 0;

let targetX = 0;
let targetY = 0;

const surface = renderer.domElement;

surface.addEventListener("pointerdown", e => {

  dragging = true;

  previousX = e.clientX;
  previousY = e.clientY;

  surface.setPointerCapture(e.pointerId);

});

surface.addEventListener("pointermove", e => {

  if (!dragging) return;

  const dx = e.clientX - previousX;
  const dy = e.clientY - previousY;

  targetY += dx * 0.009;
  targetX += dy * 0.009;

  targetX = Math.max(-1.2, Math.min(1.2, targetX));

  previousX = e.clientX;
  previousY = e.clientY;

});

surface.addEventListener("pointerup", () => {
  dragging = false;
});

surface.addEventListener("pointercancel", () => {
  dragging = false;
});

// ANIMATION

const clock = new THREE.Clock();

function animate() {

  requestAnimationFrame(animate);

  const time = clock.getElapsedTime();

  if (!dragging) {
    targetY += 0.0015;
  }

  universe.rotation.y +=
    (targetY - universe.rotation.y) * 0.06;

  universe.rotation.x +=
    (targetX - universe.rotation.x) * 0.06;

  ringGroup.rotation.z =
    Math.sin(time * 0.2) * 0.08;

  particleGroup.children.forEach(p => {

    const a = time * 0.55 + p.userData.angle;

    p.position.set(
      Math.cos(a) * 2.05,
      Math.sin(a) * 0.35,
      Math.sin(a) * 1.8
    );

  });

  stars.rotation.y += 0.0001;

  renderer.render(scene, camera);

}

animate();

status.textContent = "UNIVERSE ONLINE ✦";

// RESIZE

window.addEventListener("resize", () => {

  camera.aspect = innerWidth / innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(innerWidth, innerHeight);

});

} catch (error) {

  console.error(error);

  status.textContent = "UNIVERSE ERROR";

}

</script>

</body>
  </html>
