<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#040510">
<title>Little Universe | V3</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #040510;
  color: white;
  transition: background 1s, color 1s;
}

#universe {
  position: fixed;
  inset: 0;
}

canvas {
  display: block;
  touch-action: none;
}

.header {
  position: fixed;
  top: 38px;
  width: 100%;
  text-align: center;
  z-index: 5;
  pointer-events: none;
}

.header h1 {
  font-size: 23px;
  font-weight: 300;
  letter-spacing: 6px;
}

.header p {
  margin-top: 12px;
  font-size: 10px;
  letter-spacing: 4px;
  color: #aaa9df;
  transition: color 1s;
}

.theme-toggle {
  position: fixed;
  top: 22px;
  right: 20px;
  z-index: 10;
  width: 43px;
  height: 43px;
  border: 1px solid rgba(180,170,255,0.4);
  border-radius: 50%;
  background: rgba(60,50,110,0.35);
  color: white;
  font-size: 19px;
  cursor: pointer;
  backdrop-filter: blur(12px);
  transition: 0.4s;
}

.theme-toggle:active {
  transform: scale(0.88);
}

.footer {
  position: fixed;
  bottom: 35px;
  width: 100%;
  text-align: center;
  z-index: 5;
  pointer-events: none;
}

.footer p {
  font-size: 10px;
  letter-spacing: 3px;
  color: #aaa9d9;
  transition: color 1s;
}

#status {
  margin-top: 10px;
  font-size: 9px;
  color: #7778b8;
}

body.light {
  background: #eaf0ff;
  color: #41416e;
}

body.light .header p,
body.light .footer p {
  color: #7274a9;
}

body.light #status {
  color: #8586b9;
}

body.light .theme-toggle {
  background: rgba(255,255,255,0.75);
  color: #5c579b;
  border-color: rgba(130,120,190,0.4);
  box-shadow: 0 4px 20px rgba(100,100,180,0.15);
}

@media (max-width: 480px) {
  .header {
    top: 75px;
  }

  .header h1 {
    font-size: 19px;
  }

  .theme-toggle {
    top: 18px;
    right: 18px;
  }
}
</style>
</head>

<body>

<div id="universe"></div>

<button class="theme-toggle" id="themeToggle"
aria-label="Switch theme">☀️</button>

<div class="header">
  <h1>LITTLE UNIVERSE</h1>
  <p>BEYOND THE ORDINARY</p>
</div>

<div class="footer">
  <p>TOUCH & DRAG TO EXPLORE</p>
  <div id="status">BUILDING YOUR UNIVERSE...</div>
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const container = document.querySelector("#universe");
const status = document.querySelector("#status");
const toggle = document.querySelector("#themeToggle");

try {

// ======================================
// SCENE & CAMERA
// ======================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x040510);

const camera = new THREE.PerspectiveCamera(
  48,
  innerWidth / innerHeight,
  0.1,
  100
);

camera.position.set(0, 0, 7.5);

const renderer = new THREE.WebGLRenderer({
  antialias: false,
  alpha: false
});

renderer.setPixelRatio(
  Math.min(devicePixelRatio, 1.25)
);

renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;

container.appendChild(renderer.domElement);

// ======================================
// UNIVERSE GROUP
// ======================================

const universe = new THREE.Group();
scene.add(universe);

// ======================================
// PLANET TEXTURE
// ======================================

const planetCanvas = document.createElement("canvas");

planetCanvas.width = 512;
planetCanvas.height = 256;

const ctx = planetCanvas.getContext("2d");

function drawPlanetTexture(light) {

  const colors = light
    ? ["#d9d5ff", "#ffcbe9", "#aee5f5", "#eee5ff"]
    : ["#101d50", "#51409b", "#193f78", "#11132e"];

  const gradient = ctx.createLinearGradient(
    0, 0, 512, 256
  );

  gradient.addColorStop(0, colors[0]);
  gradient.addColorStop(0.4, colors[1]);
  gradient.addColorStop(0.7, colors[2]);
  gradient.addColorStop(1, colors[3]);

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 512, 256);

  // Planet surface formations

  for (let i = 0; i < 32; i++) {

    const x = Math.random() * 512;
    const y = Math.random() * 256;
    const size = 12 + Math.random() * 35;

    ctx.beginPath();
    ctx.moveTo(x, y);

    ctx.bezierCurveTo(
      x + size, y - size,
      x + size * 1.8, y + size,
      x + size * 0.8, y + size * 1.5
    );

    ctx.bezierCurveTo(
      x - size * 0.5, y + size * 1.8,
      x - size, y + size * 0.5,
      x, y
    );

    ctx.fillStyle = light
      ? (i % 2 === 0 ? "#f5d5ef" : "#a8d9ed")
      : (i % 2 === 0 ? "#8274c9" : "#326a9d");

    ctx.globalAlpha = light ? 0.48 : 0.65;
    ctx.fill();
  }

  // Atmospheric surface lines

  for (let i = 0; i < 35; i++) {

    ctx.beginPath();

    const y = Math.random() * 256;

    ctx.moveTo(0, y);

    ctx.bezierCurveTo(
      140, y - 12,
      320, y + 15,
      512, y - 5
    );

    ctx.strokeStyle = light
      ? "#ffffff"
      : "#a9b7ff";

    ctx.globalAlpha = light ? 0.2 : 0.12;
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  ctx.globalAlpha = 1;
}

drawPlanetTexture(false);

const planetTexture = new THREE.CanvasTexture(planetCanvas);
planetTexture.colorSpace = THREE.SRGBColorSpace;

// ======================================
// PLANET
// ======================================

const planetMaterial = new THREE.MeshStandardMaterial({
  map: planetTexture,

  // Use the texture as the planet's light source
  // in Light Mode to preserve its pastel colors.

  emissive: 0xffffff,
  emissiveMap: planetTexture,
  emissiveIntensity: 0,

  roughness: 0.85,
  metalness: 0.12
});

const planet = new THREE.Mesh(
  new THREE.SphereGeometry(1.05, 64, 48),
  planetMaterial
);

universe.add(planet);

// ======================================
// ATMOSPHERE
// ======================================

const atmosphereMaterial = new THREE.MeshBasicMaterial({
  color: 0x8176ff,
  transparent: true,
  opacity: 0.14,
  side: THREE.BackSide,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const atmosphere = new THREE.Mesh(
  new THREE.SphereGeometry(1.18, 48, 48),
  atmosphereMaterial
);

universe.add(atmosphere);

// Outer atmosphere

const outerGlow = new THREE.Mesh(
  new THREE.SphereGeometry(1.30, 40, 40),
  new THREE.MeshBasicMaterial({
    color: 0x5b7dff,
    transparent: true,
    opacity: 0.045,
    side: THREE.BackSide,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);

universe.add(outerGlow);

// ======================================
// LIGHTS
// ======================================

const ambient = new THREE.AmbientLight(
  0x7777bb, 1.4
);

scene.add(ambient);

const violetLight = new THREE.PointLight(
  0xa58aff, 90, 30
);

violetLight.position.set(-4, 3, 5);
scene.add(violetLight);

const blueLight = new THREE.PointLight(
  0x368bff, 70, 25
);

blueLight.position.set(4, -3, -3);
scene.add(blueLight);

// ======================================
// 3D NEBULA
// ======================================

const nebulaGroup = new THREE.Group();
scene.add(nebulaGroup);

const nebulaParticles = [];

function createNebulaCloud(
  count,
  center,
  spread,
  palette
) {

  const positions = [];
  const colors = [];

  for (let i = 0; i < count; i++) {

    const x = center.x + (Math.random() - 0.5) * spread.x;
    const y = center.y + (Math.random() - 0.5) * spread.y;
    const z = center.z + (Math.random() - 0.5) * spread.z;

    positions.push(x, y, z);

    const chosen = palette[
      Math.floor(Math.random() * palette.length)
    ];

    colors.push(chosen.r, chosen.g, chosen.b);
  }

  const geometry = new THREE.BufferGeometry();

  geometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(positions, 3)
  );

  geometry.setAttribute(
    "color",
    new THREE.Float32BufferAttribute(colors, 3)
  );

  const material = new THREE.PointsMaterial({
    size: 0.16,
    vertexColors: true,
    transparent: true,
    opacity: 0.25,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    sizeAttenuation: true
  });

  const cloud = new THREE.Points(geometry, material);

  nebulaGroup.add(cloud);

  nebulaParticles.push({
    geometry,
    material,
    count
  });

}

const darkNebula = [
  new THREE.Color("#5140b9"),
  new THREE.Color("#326cba"),
  new THREE.Color("#a05bd1"),
  new THREE.Color("#283e87")
];

const lightNebula = [
  new THREE.Color("#c5b9f5"),
  new THREE.Color("#f2bde1"),
  new THREE.Color("#9ed8ed"),
  new THREE.Color("#e8d7fa")
];

createNebulaCloud(
  450,
  new THREE.Vector3(-3, 1.5, -5),
  new THREE.Vector3(7, 4, 2),
  darkNebula
);

createNebulaCloud(
  400,
  new THREE.Vector3(3, -1.8, -7),
  new THREE.Vector3(8, 4, 2),
  darkNebula
);

createNebulaCloud(
  300,
  new THREE.Vector3(0, 3, -9),
  new THREE.Vector3(10, 3, 2),
  darkNebula
);

function updateNebula(light) {

  const palette = light ? lightNebula : darkNebula;

  nebulaParticles.forEach(cloud => {

    const colors = [];

    for (let i = 0; i < cloud.count; i++) {

      const chosen = palette[
        Math.floor(Math.random() * palette.length)
      ];

      colors.push(
        chosen.r,
        chosen.g,
        chosen.b
      );
    }

    cloud.geometry.setAttribute(
      "color",
      new THREE.Float32BufferAttribute(colors, 3)
    );

    cloud.material.opacity = light ? 0.19 : 0.25;

  });

}

// ======================================
// ORBIT RINGS
// ======================================

const ringGroup = new THREE.Group();
universe.add(ringGroup);

ringGroup.rotation.x = 1.05;
ringGroup.rotation.y = 0.2;

const ringOne = new THREE.Mesh(
  new THREE.TorusGeometry(2.05, 0.014, 6, 160),
  new THREE.MeshBasicMaterial({
    color: 0x8c8bff,
    transparent: true,
    opacity: 0.85
  })
);

ringGroup.add(ringOne);

const ringTwo = new THREE.Mesh(
  new THREE.TorusGeometry(2.3, 0.007, 6, 160),
  new THREE.MeshBasicMaterial({
    color: 0x42caff,
    transparent: true,
    opacity: 0.55
  })
);

ringGroup.add(ringTwo);

// ======================================
// ORBITING PARTICLES
// ======================================

const particleGroup = new THREE.Group();
universe.add(particleGroup);

for (let i = 0; i < 3; i++) {

  const particle = new THREE.Mesh(
    new THREE.SphereGeometry(0.045, 10, 10),
    new THREE.MeshBasicMaterial({
      color: i === 1 ? 0x65caff : 0xc6aaff
    })
  );

  particleGroup.add(particle);

  particle.userData.angle = i * Math.PI * 2 / 3;
}

// ======================================
// SMALL 3D SPACESHIP
// ======================================

const ship = new THREE.Group();
universe.add(ship);

// Main body

const shipBody = new THREE.Mesh(
  new THREE.CylinderGeometry(
    0.055, 0.095, 0.58, 8
  ),
  new THREE.MeshStandardMaterial({
    color: 0xdce5ff,
    metalness: 0.75,
    roughness: 0.3
  })
);

shipBody.rotation.z = -Math.PI / 2;
ship.add(shipBody);

// Nose

const shipNose = new THREE.Mesh(
  new THREE.ConeGeometry(0.075, 0.25, 8),
  new THREE.MeshStandardMaterial({
    color: 0x9dbdff,
    metalness: 0.5,
    roughness: 0.25
  })
);

shipNose.rotation.z = -Math.PI / 2;
shipNose.position.x = 0.39;
ship.add(shipNose);

// Wings

function createWing(x, y, rotation) {

  const wing = new THREE.Mesh(
    new THREE.BoxGeometry(0.32, 0.035, 0.25),
    new THREE.MeshStandardMaterial({
      color: 0x929bd5,
      metalness: 0.55,
      roughness: 0.4
    })
  );

  wing.position.set(x, y, 0);
  wing.rotation.z = rotation;

  ship.add(wing);
}

createWing(-0.05, 0.14, -0.3);
createWing(-0.05, -0.14, 0.3);

// Engine glow

const engine = new THREE.Mesh(
  new THREE.SphereGeometry(0.07, 12, 12),
  new THREE.MeshBasicMaterial({
    color: 0x58caff
  })
);

engine.position.x = -0.31;
ship.add(engine);

const engineLight = new THREE.PointLight(
  0x4bbcff, 2, 2
);

engineLight.position.x = -0.38;
ship.add(engineLight);

// Navigation lights

const navLight = new THREE.Mesh(
  new THREE.SphereGeometry(0.035, 8, 8),
  new THREE.MeshBasicMaterial({
    color: 0xffa9e8
  })
);

navLight.position.set(0, 0.16, 0.08);
ship.add(navLight);

// ======================================
// STARS
// ======================================

const starPositions = [];

for (let i = 0; i < 550; i++) {

  starPositions.push(
    (Math.random() - 0.5) * 50,
    (Math.random() - 0.5) * 50,
    (Math.random() - 0.5) * 40
  );

}

const starGeometry = new THREE.BufferGeometry();

starGeometry.setAttribute(
  "position",
  new THREE.Float32BufferAttribute(starPositions, 3)
);

const starMaterial = new THREE.PointsMaterial({
  color: 0xc7caff,
  size: 0.035,
  transparent: true,
  opacity: 0.8
});

const stars = new THREE.Points(
  starGeometry,
  starMaterial
);

scene.add(stars);

// ======================================
// THEME SYSTEM
// ======================================

let isLight = false;

const darkSettings = {
  background: 0x040510,
  ambient: 1.4,
  violet: 90,
  blue: 70,
  atmosphere: 0.14,
  outerGlow: 0.045,
  ringOne: 0x8c8bff,
  ringTwo: 0x42caff,
  star: 0xc7caff,
  starOpacity: 0.8
};

const lightSettings = {
  background: 0xeaf0ff,
  ambient: 2.0,
  violet: 55,
  blue: 45,
  atmosphere: 0.27,
  outerGlow: 0.075,
  ringOne: 0xb2a0e8,
  ringTwo: 0x79c6e5,
  star: 0x7378ae,
  starOpacity: 0.48
};

function applyTheme(light) {

  const settings = light
    ? lightSettings
    : darkSettings;

  scene.background.setHex(settings.background);

  ambient.intensity = settings.ambient;

  violetLight.intensity = settings.violet;
  blueLight.intensity = settings.blue;

  atmosphere.material.color.setHex(
    light ? 0xd9caff : 0x8176ff
  );

  atmosphere.material.opacity = settings.atmosphere;

  outerGlow.material.color.setHex(
    light ? 0xe5c9f5 : 0x5b7dff
  );

  outerGlow.material.opacity = settings.outerGlow;

  ringOne.material.color.setHex(settings.ringOne);
  ringTwo.material.color.setHex(settings.ringTwo);

  starMaterial.color.setHex(settings.star);
  starMaterial.opacity = settings.starOpacity;

  // Change the planet's actual surface colors

  drawPlanetTexture(light);
  planetTexture.needsUpdate = true;

  // Brighten the pastel texture in Light Mode.
  // Turn off the extra emission in Dark Mode.

  planetMaterial.emissiveIntensity = light ? 0.75 : 0;

  // Change nebula colors

  updateNebula(light);

  // Change spaceship appearance

  shipBody.material.color.setHex(
    light ? 0xf5eaff : 0xdce5ff
  );

  shipNose.material.color.setHex(
    light ? 0xd7bdf4 : 0x9dbdff
  );

  document.body.classList.toggle("light", light);

  toggle.textContent = light ? "🌙" : "☀️";

  toggle.setAttribute(
    "aria-label",
    light ? "Switch to dark mode" : "Switch to light mode"
  );

  try {
    localStorage.setItem(
      "little-universe-theme",
      light ? "light" : "dark"
    );
  } catch (e) {}

}

// Load saved theme

let savedTheme = "dark";

try {
  savedTheme =
    localStorage.getItem("little-universe-theme") || "dark";
} catch (e) {}

isLight = savedTheme === "light";

applyTheme(isLight);

toggle.addEventListener("click", () => {

  isLight = !isLight;

  applyTheme(isLight);

});

// ======================================
// DRAG INTERACTION
// ======================================

let dragging = false;

let previousX = 0;
let previousY = 0;

let targetX = 0;
let targetY = 0;

const surface = renderer.domElement;

surface.addEventListener("pointerdown", e => {

  dragging = true;

  previousX = e.clientX;
  previousY = e.clientY;

  surface.setPointerCapture(e.pointerId);

});

surface.addEventListener("pointermove", e => {

  if (!dragging) return;

  const dx = e.clientX - previousX;
  const dy = e.clientY - previousY;

  targetY += dx * 0.009;
  targetX += dy * 0.009;

  targetX = Math.max(-1.2, Math.min(1.2, targetX));

  previousX = e.clientX;
  previousY = e.clientY;

});

surface.addEventListener("pointerup", () => {
  dragging = false;
});

surface.addEventListener("pointercancel", () => {
  dragging = false;
});

// ======================================
// CINEMATIC ANIMATION
// ======================================

const clock = new THREE.Clock();

function animate() {

  requestAnimationFrame(animate);

  const time = clock.getElapsedTime();

  // Slow automatic planet movement

  if (!dragging) {
    targetY += 0.0015;
  }

  universe.rotation.y +=
    (targetY - universe.rotation.y) * 0.06;

  universe.rotation.x +=
    (targetX - universe.rotation.x) * 0.06;

  // Ring movement

  ringGroup.rotation.z =
    Math.sin(time * 0.2) * 0.08;

  // Orbiting particles

  particleGroup.children.forEach(p => {

    const a = time * 0.55 + p.userData.angle;

    p.position.set(
      Math.cos(a) * 2.05,
      Math.sin(a) * 0.35,
      Math.sin(a) * 1.8
    );

  });

  // Spaceship orbit

  const shipAngle = time * 0.34;

  ship.position.set(
    Math.cos(shipAngle) * 2.75,
    Math.sin(shipAngle * 1.2) * 0.75,
    Math.sin(shipAngle) * 2.25
  );

  ship.rotation.y = -shipAngle;
  ship.rotation.z = Math.sin(shipAngle) * 0.12;

  // Engine glow pulse

  engine.scale.setScalar(
    0.85 + Math.sin(time * 8) * 0.15
  );

  // Nebula slow movement

  nebulaGroup.rotation.z = Math.sin(time * 0.06) * 0.025;
  nebulaGroup.rotation.y = Math.sin(time * 0.04) * 0.025;

  // Star movement

  stars.rotation.y += 0.0001;

  // Cinematic camera drift

  camera.position.x = Math.sin(time * 0.16) * 0.12;
  camera.position.y = Math.cos(time * 0.13) * 0.09;

  camera.position.z =
    7.5 + Math.sin(time * 0.2) * 0.12;

  camera.lookAt(0, 0, 0);

  // Planet floating motion

  planet.position.y = Math.sin(time * 0.45) * 0.025;
  atmosphere.position.y = planet.position.y;
  outerGlow.position.y = planet.position.y;

  renderer.render(scene, camera);

}

animate();

status.textContent = "UNIVERSE ONLINE ✦";

// ======================================
// RESIZE
// ======================================

window.addEventListener("resize", () => {

  camera.aspect = innerWidth / innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(innerWidth, innerHeight);

});

} catch (error) {

  console.error(error);

  status.textContent = "ERROR: " + error.message;

}

</script>

</body>
</html>
